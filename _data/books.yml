- title: "Overscan"
  author: "Nicholas Bernard"
  cover: "/assets/img/books/overscan.jpg"
  end: "2025-10-20"
  start: "2025-09-02"
  summary: "This was an amazing collaborative effort between multiple authors who worked together to make a small collection of short stories. The whole anthology, whose subtitle is Stories from Beyond the Screen’s Edge, was simply a joy to read. I read half of them in one day, and I would have done them all in one sitting if it wasn’t because I’m a professional procrastinator. I will actually read it again and write a proper review soon, because this book deserves it."
- title: "Babylon's Ashes"
  author: "James S.A. Corey"
  cover: "/assets/img/books/babylons-ashes.jpg"
  start: "2025-09-25"
  end: "2025-10-17"
  summary: "The conclusion to the second trilogy of the series. This book picks up with a mystery setup since the previous one, and it does so masterfully. I really enjoyed the new character dynamics and how it set everything in place while giving closure to many characters as well. It was fantastic, even if I could already tell how it would end like 10 chapters in advance."
